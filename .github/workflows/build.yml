name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you kick off a build (and get binaries) by hand

permissions:
  contents: write           # needed only to create the release and attach files

jobs:
  build-windows:
    # WPF only builds on Windows. Windows runners bill 2x on private repos; this
    # repo is public, where Actions is free.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogLens/LogLens.csproj

      - name: Build (warnings are errors)
        run: dotnet build LogLens/LogLens.csproj -c Release --no-restore -warnaserror

      - name: Build Avalonia app
        run: dotnet build LogLens.Avalonia/LogLens.Avalonia.csproj -c Release

      - name: Run checks
        run: dotnet run --project tests/RuleCheck -c Release

      - name: Publish portable exe
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./build.ps1
        shell: pwsh

      - name: Checksum
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $exe = 'dist/SelfContained/LogLens.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LogLens.exe" | Out-File 'dist/SelfContained/SHA256SUMS.txt' -Encoding ascii

      # Matrix builds are the one place artifacts are genuinely necessary: the
      # release job needs the outputs of two different runners in one place.
      - name: Upload Windows build
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/SelfContained/LogLens.exe
            dist/SelfContained/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  build-macos:
    # The Avalonia app, self-contained for both Mac architectures. Built on a real
    # macOS runner so executable bits and tar metadata come out right.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish for Apple Silicon and Intel
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish LogLens.Avalonia/LogLens.Avalonia.csproj -c Release -r $rid \
              --self-contained -p:PublishSingleFile=true -p:DebugType=none -o "out/$rid"
            # The binary is the whole app; "LogLens.Avalonia" made people think they
            # had to install Avalonia. Renaming the apphost is safe — the bundle it
            # loads is inside its own file.
            mv "out/$rid/LogLens.Avalonia" "out/$rid/LogLens"
            chmod +x "out/$rid/LogLens"
            cp packaging/macos-readme.txt "out/$rid/README.txt"
            tar -czf "LogLens-macos-$rid.tar.gz" -C "out/$rid" .
          done
          shasum -a 256 LogLens-macos-*.tar.gz > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      # Signing/notarisation hook: lights up automatically once the repo has the
      # secrets from an Apple Developer account. Until then macOS users clear
      # Gatekeeper manually (see README).
      - name: Codesign and notarise
        if: ${{ false }}   # enable when APPLE_CERT_P12/APPLE_ID secrets exist
        run: echo "wire codesign + notarytool here"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            LogLens-macos-*.tar.gz
            SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            LogLens.exe
            SHA256SUMS.txt
            LogLens-macos-*.tar.gz
            SHA256SUMS-macos.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
