name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you kick off a build (and get an exe) by hand

permissions:
  contents: write           # needed to create the release and attach the exe

jobs:
  build:
    # WPF only builds on Windows, so this cannot use ubuntu-latest. Windows runners
    # bill at 2x minutes, which is why the exe is only produced when it is wanted.
    #
    # Deliberately a single job. Artifacts exist to carry files between jobs, since
    # each job starts on a clean machine — so publishing the release from this same
    # job means the exe is already on disk and no artifact is involved at all.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogLens/LogLens.csproj

      - name: Build (warnings are errors)
        run: dotnet build LogLens/LogLens.csproj -c Release --no-restore -warnaserror

      - name: Run checks
        run: dotnet run --project tests/RuleCheck -c Release

      - name: Publish portable exe
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./build.ps1
        shell: pwsh

      # Lets a download be checked against what CI actually produced. It does not
      # silence the SmartScreen warning — only code signing does that.
      - name: Checksum
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $exe = 'dist/SelfContained/LogLens.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LogLens.exe" | Out-File 'dist/SelfContained/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256: $hash"

      # Tagged builds go straight to the release from this job's own disk. Release
      # assets do not count against the 500 MB Actions storage quota.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SelfContained/LogLens.exe
            dist/SelfContained/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true

      # Only for manual runs: a way to grab a build without cutting a release.
      # One day of retention, because that is all such a build is ever needed for.
      - name: Upload build for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: LogLens-portable-win-x64
          path: |
            dist/SelfContained/LogLens.exe
            dist/SelfContained/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
