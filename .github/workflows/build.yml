name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you kick off a build by hand from the Actions tab

permissions:
  contents: write           # needed only by the release job, to attach the exe

jobs:
  build:
    # WPF only builds on Windows, so this cannot use ubuntu-latest.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogLens/LogLens.csproj

      - name: Build (warnings are errors)
        run: dotnet build LogLens/LogLens.csproj -c Release --no-restore -warnaserror

      - name: Run checks
        run: dotnet run --project tests/RuleCheck -c Release

      - name: Publish portable exe
        run: ./build.ps1
        shell: pwsh

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: LogLens-portable-win-x64
          path: dist/SelfContained/LogLens.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # Tag a commit v1.1.0 and the portable exe is attached to a GitHub release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download the built exe
        uses: actions/download-artifact@v8
        with:
          name: LogLens-portable-win-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: LogLens.exe
          generate_release_notes: true
          draft: false
