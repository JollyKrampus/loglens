name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you kick off a build (and get an exe) by hand

permissions:
  contents: write           # needed only by the release job, to attach the exe

jobs:
  build:
    # WPF only builds on Windows, so this cannot use ubuntu-latest.
    # Note: Windows runners bill at 2x minutes against the free allowance.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogLens/LogLens.csproj

      - name: Build (warnings are errors)
        run: dotnet build LogLens/LogLens.csproj -c Release --no-restore -warnaserror

      - name: Run checks
        run: dotnet run --project tests/RuleCheck -c Release

      # The portable exe is ~58 MB and the free plan only allows 500 MB of artifact
      # storage, so it is only produced when someone actually wants a binary: a
      # release tag, or a manual run. Ordinary pushes still get build + test cover.
      - name: Publish portable exe
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./build.ps1
        shell: pwsh

      # Lets anyone confirm the download matches what CI actually produced. It does
      # not stop the SmartScreen warning — only code signing does that — but it is
      # the free half of vouching for a binary.
      - name: Checksum
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $exe = 'dist/SelfContained/LogLens.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LogLens.exe" | Out-File 'dist/SelfContained/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload portable exe
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: LogLens-portable-win-x64
          path: |
            dist/SelfContained/LogLens.exe
            dist/SelfContained/SHA256SUMS.txt
          if-no-files-found: error
          # Short retention: a tagged build is kept on the release itself, and
          # release assets do not count against the Actions storage quota.
          retention-days: 5

  release:
    # Push a tag such as v1.1.0 and the portable exe is attached to a GitHub release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest      # billed 1x, and this job only moves a file

    steps:
      - name: Download the built exe
        uses: actions/download-artifact@v8
        with:
          name: LogLens-portable-win-x64

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            LogLens.exe
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
